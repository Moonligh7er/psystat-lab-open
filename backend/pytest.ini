[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    validation: numerical-accuracy golden-number test against a canonical reference (NIST StRD, R, or peer-reviewed textbook). Contributes to /validation dashboard.
    smoke: response-schema / HTTP-status check; does NOT verify numerical correctness.

addopts =
    --strict-markers
    -ra

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
