<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#131926"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="orb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative orbs -->
  <circle cx="200" cy="150" r="200" fill="url(#orb1)" filter="url(#blur1)"/>
  <circle cx="1000" cy="500" r="250" fill="url(#orb2)" filter="url(#blur2)"/>
  <circle cx="600" cy="300" r="150" fill="url(#orb1)" filter="url(#blur1)" opacity="0.5"/>

  <!-- Border accent line at top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo icon -->
  <rect x="80" y="180" width="72" height="72" rx="16" fill="#6366F1" opacity="0.2"/>
  <text x="116" y="234" font-family="Georgia, serif" font-size="40" fill="#818CF8" text-anchor="middle">&#936;</text>

  <!-- App name -->
  <text x="170" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="#F1F5F9">PsyStat</text>
  <text x="345" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#accent)">Lab</text>

  <!-- Tagline -->
  <text x="80" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="#F1F5F9">AI-Powered Statistics</text>
  <text x="80" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="#F1F5F9">for Behavioral Science</text>

  <!-- Stats chips -->
  <rect x="80" y="410" width="160" height="44" rx="22" fill="#6366F1" opacity="0.15" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1"/>
  <text x="160" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#818CF8" text-anchor="middle">240+ Methods</text>

  <rect x="260" y="410" width="145" height="44" rx="22" fill="#06B6D4" opacity="0.15" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="332" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#06B6D4" text-anchor="middle">33 Modules</text>

  <rect x="425" y="410" width="175" height="44" rx="22" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="512" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#10B981" text-anchor="middle">AI Research Tools</text>

  <!-- Subtitle -->
  <text x="80" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#94A3B8">From hypothesis to publication. Free to start.</text>

  <!-- Company -->
  <text x="80" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748B">psystat-lab.dev</text>
  <text x="1120" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="end">Moonlit Social Labs</text>

  <!-- Right side decorative elements - mini chart/graph visualization -->
  <g transform="translate(780, 160)" opacity="0.6">
    <!-- Bar chart -->
    <rect x="0" y="80" width="24" height="120" rx="4" fill="#6366F1" opacity="0.6"/>
    <rect x="36" y="40" width="24" height="160" rx="4" fill="#818CF8" opacity="0.7"/>
    <rect x="72" y="100" width="24" height="100" rx="4" fill="#06B6D4" opacity="0.6"/>
    <rect x="108" y="20" width="24" height="180" rx="4" fill="#10B981" opacity="0.6"/>
    <rect x="144" y="60" width="24" height="140" rx="4" fill="#F59E0B" opacity="0.5"/>
    <rect x="180" y="90" width="24" height="110" rx="4" fill="#EC4899" opacity="0.5"/>
    <!-- Trend line -->
    <polyline points="12,75 48,35 84,95 120,15 156,55 192,85" fill="none" stroke="#F1F5F9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Dots on trend -->
    <circle cx="12" cy="75" r="4" fill="#F1F5F9" opacity="0.9"/>
    <circle cx="48" cy="35" r="4" fill="#F1F5F9" opacity="0.9"/>
    <circle cx="84" cy="95" r="4" fill="#F1F5F9" opacity="0.9"/>
    <circle cx="120" cy="15" r="4" fill="#F1F5F9" opacity="0.9"/>
    <circle cx="156" cy="55" r="4" fill="#F1F5F9" opacity="0.9"/>
    <circle cx="192" cy="85" r="4" fill="#F1F5F9" opacity="0.9"/>
  </g>

  <!-- Distribution curve -->
  <g transform="translate(800, 380)" opacity="0.4">
    <path d="M0,100 C30,100 50,90 80,60 C100,40 120,10 150,5 C180,10 200,40 220,60 C250,90 270,100 300,100" fill="none" stroke="#818CF8" stroke-width="2.5"/>
    <path d="M0,100 C30,100 50,90 80,60 C100,40 120,10 150,5 C180,10 200,40 220,60 C250,90 270,100 300,100 L300,100 L0,100 Z" fill="#6366F1" opacity="0.1"/>
  </g>
</svg>
