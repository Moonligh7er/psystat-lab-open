name: Validation Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Backend numerical accuracy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Unit tests
        run: pytest -m "not smoke and not validation" -v
      - name: Smoke tests (no endpoint returns a server error)
        run: pytest -m smoke -v
      - name: Validation suite (golden-number tests)
        run: pytest -m validation -v
